[project]
name = "medical-expenses-tracker"
version = "0.1.0"
description = "Track medical expenses for FSA reimbursement"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "gspread>=6.0.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
